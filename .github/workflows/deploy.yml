name: Deploy VPS Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: main

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || 'main' }}
      VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}

    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          envs: TARGET_REF,VPS_PROJECT_DIR
          script: |
            set -e

            PROJECT_DIR="${VPS_PROJECT_DIR:-/var/www/createam-platform}"
            cd "$PROJECT_DIR"

            if command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi

            git fetch --all
            git checkout "$TARGET_REF"
            git pull origin "$TARGET_REF"

            $DC down
            $DC build --no-cache
            $DC up -d

            HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$HEALTH_CODE" != "200" ]; then
              echo "Health check failed, status: $HEALTH_CODE"
              exit 1
            fi

            AUDIT_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/admin/audit || true)
            if [ "$AUDIT_CODE" = "404" ] || [ -z "$AUDIT_CODE" ]; then
              echo "Audit route missing after deploy, status: $AUDIT_CODE"
              exit 1
            fi

            $DC ps
