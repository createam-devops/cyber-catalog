name: Deploy VPS Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen
        id: image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cyber-catalog"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "name=$IMAGE:latest" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "ERROR: clave SSH no válida"; exit 1; }
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar docker-compose.yml al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/var/www/createam-platform' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:$PROJECT_DIR/docker-compose.yml"

      - name: Actualizar contenedor en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/var/www/createam-platform' }}
          DOCKER_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" << EOF
          set -e
          cd "$PROJECT_DIR"

          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi

          export DOCKER_IMAGE="$DOCKER_IMAGE"
          \$DC down
          docker pull "$DOCKER_IMAGE"
          \$DC up -d --remove-orphans

          sleep 10

          HEALTH=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
          echo "Health check: \$HEALTH"
          [ "\$HEALTH" = "200" ] || { echo "Health check falló"; exit 1; }

          \$DC ps
          EOF
