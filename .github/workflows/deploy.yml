name: Deploy VPS Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: main

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || 'main' }}
      VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}

    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' elimina saltos de línea de Windows que rompen el parsing
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/var/www/createam-platform' }}
          TARGET_REF: ${{ env.TARGET_REF }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            "set -e
            cd '${PROJECT_DIR}'

            if command -v docker-compose >/dev/null 2>&1; then
              DC='docker-compose'
            else
              DC='docker compose'
            fi

            git fetch --all
            git checkout '${TARGET_REF:-main}'
            git pull origin '${TARGET_REF:-main}'

            \$DC down
            \$DC build --no-cache
            \$DC up -d

            sleep 10

            HEALTH_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            echo \"Health check: \$HEALTH_CODE\"
            if [ \"\$HEALTH_CODE\" != '200' ]; then
              echo 'Health check failed'
              exit 1
            fi

            \$DC ps"
