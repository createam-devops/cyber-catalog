services:
  createam-platform:
    image: ${DOCKER_IMAGE}
    container_name: createam-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CENTRAL_FIREBASE_API_KEY=${NEXT_PUBLIC_CENTRAL_FIREBASE_API_KEY}
      - CENTRAL_FIREBASE_API_KEY=${CENTRAL_FIREBASE_API_KEY}
      - NEXT_PUBLIC_CENTRAL_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_CENTRAL_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_CENTRAL_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_CENTRAL_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_CENTRAL_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_CENTRAL_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_CENTRAL_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_CENTRAL_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_CENTRAL_FIREBASE_APP_ID=${NEXT_PUBLIC_CENTRAL_FIREBASE_APP_ID}
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${NEXT_PUBLIC_PLATFORM_DOMAIN}
      - FIREBASE_ADMIN_PROJECT_ID=${FIREBASE_ADMIN_PROJECT_ID}
      - FIREBASE_ADMIN_CLIENT_EMAIL=${FIREBASE_ADMIN_CLIENT_EMAIL}
      - FIREBASE_ADMIN_PRIVATE_KEY=${FIREBASE_ADMIN_PRIVATE_KEY}
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      # Integración con el ERP. Vacías = apagada (las tiendas siguen en Firebase).
      - ERP_API_BASE_URL=${ERP_API_BASE_URL:-}
      - ERP_APP_CLIENT_ID=${ERP_APP_CLIENT_ID:-catalog}
      - ERP_APP_CLIENT_SECRET=${ERP_APP_CLIENT_SECRET:-}
      - ERP_WEBHOOK_SECRET=${ERP_WEBHOOK_SECRET:-}
      # Ingreso del dueño con su usuario de CyberPOS: firma de la cookie de sesión
      # (32+ caracteres) y dirección de CyberPOS para el botón "Abrir CyberPOS".
      - ERP_SESSION_SECRET=${ERP_SESSION_SECRET:-}
      - ERP_APP_URL=${ERP_APP_URL:-}
      # Registro con alta en CyberPOS: plan del alta (en dev, catalogo_digital). Vacía = registro de siempre.
      - ERP_SIGNUP_PLAN_CODE=${ERP_SIGNUP_PLAN_CODE:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://createam.cloud}
      # Base propia del catálogo (SQLite), sus copias diarias e imágenes de las tiendas.
      - DATA_DIR=/app/data
      - GOOGLE_CLOUD_QUOTA_PROJECT=
      - NODE_ENV=production
    volumes:
      # Imágenes ya optimizadas: sin volumen, cada despliegue las borraba y el
      # servidor tenía que volver a procesar todas las fotos.
      - next-cache:/app/.next/cache
      # Configuración de las tiendas del ERP: NO borrar este volumen.
      - catalog-data:/app/data
    healthcheck:
      # La imagen (Alpine) no trae curl, sí wget. 127.0.0.1: Next escucha en IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  next-cache:
  catalog-data:
